[package]
name = "snowlark-net"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false
description = "Fetch for Snowlark: HTTP/1.1 and HTTP/2 over TLS, cookies, HSTS, CORS, CSP, mixed content, data: and blob: URLs."

[dependencies]
base64 = "0.22"
brotli-decompressor = "5"
bytes = { version = "1", features = ["serde"] }
encoding_rs = "0.8"
flate2 = "1"
getrandom = "0.3"
# (only to read an HTTP/2 error's reason through hyper: REFUSED_STREAM and GOAWAY retries)
h2 = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
psl = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "fs", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
url = { version = "2.5", features = ["serde"] }
zstd = "0.13"

[dev-dependencies]
brotli = "8"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "it"
path = "tests/it.rs"
