[package]
name = "snowlark-render"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false
description = "The Snowlark document renderer: stylo's computed values as layout's Style, subresource loading, and the style-layout-paint pipeline"

[dependencies]
snowlark-dom = { path = "../snowlark-dom" }
snowlark-style = { path = "../snowlark-style" }
snowlark-layout = { path = "../snowlark-layout" }
snowlark-paint = { path = "../snowlark-paint" }
snowlark-net = { path = "../snowlark-net" }
stylo = "0.24"
stylo_atoms = "0.24"
servo_arc = "0.6"
cssparser = "0.38"
stylo_traits = "0.24"
euclid = "0.22"
app_units = "0.7"
url = "2.5"
smallvec = "1.13"
rustc-hash = "2"
encoding_rs = "0.8"
flate2 = "1"
# SVG images: resvg's usvg parses and simplifies (with roxmltree and fontdb), resvg rasterizes with
# tiny-skia.
resvg = "=0.48.1"
# CSS colour syntax for the canvas (the version usvg uses).
svgtypes = "=0.16.1"
kurbo = "0.13"

[[bench]]
name = "churn"
harness = false

[[test]]
name = "it"
path = "tests/it.rs"
