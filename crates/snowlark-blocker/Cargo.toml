[package]
name = "snowlark-blocker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Content blocking for Snowlark: uBlock Origin's filter lists and syntax through Brave's adblock-rust engine"

[dependencies]
snowlark-net = { path = "../snowlark-net" }
snowlark-js = { path = "../snowlark-js" }
snowlark-page = { path = "../snowlark-page" }
# Brave's engine (MPL-2.0). Not "single-thread": the engine is shared by the network thread and the
# page threads.
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
base64 = "0.22"
bytes = "1"
psl = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[dev-dependencies]
memory-stats = "1.2"
