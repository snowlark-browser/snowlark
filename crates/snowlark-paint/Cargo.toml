[package]
name = "snowlark-paint"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
# The platform-free types (geometry, display list, filters, layer animations), re-exported here.
snowlark-graphics = { path = "../snowlark-graphics" }
serde = { version = "1", features = ["derive"] }
# The system font database resvg draws SVG and canvas text with (snowlark-render); here only to map
# its files once ([`font_files::map_all`]), which takes `unsafe`.
fontdb = "0.24"
rustc-hash = "2"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
# UAX #50 Vertical_Orientation (`text-orientation: mixed`).
unicode-vo = "0.1"
# OTS, which checks web fonts before DirectWrite reads them (`web_font`), and the zlib and Brotli
# decoders it is given for WOFF 1.0 and WOFF 2.0.
snowlark-ots-sys = { path = "../snowlark-ots-sys" }
flate2 = "1"
brotli-decompressor = "5"

[target.'cfg(not(windows))'.dependencies]
# PNG encoding of rendered pixmaps (`image`; Windows' goes through WIC).
png = "0.18"
# The text engine's analyses (`linux/text.rs`; DirectWrite's on Windows): UAX #9 bidi levels,
# UAX #24 scripts, UAX #14 line-break opportunities.
unicode-bidi = "0.3"
unicode-script = "0.5"
icu_segmenter = "2"
# The raster backend (`linux/raster.rs`; Direct2D on Windows): CPU raster for the headless modes, GL for
# tiles and the compositor (docs/linux.md, "Decisions").
skia-safe = { version = "0.158", features = ["gl"] }
# The window (`linux/window.rs`; Win32 on Windows): a Wayland client, X11 desktops through XWayland
# (docs/linux.md, "Decisions"); its keyboard through the system's libxkbcommon.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
# The C library's local time (`linux/window.rs` `local_offset_ms`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-numerics = "0.3"
# `IAsyncOperation::join` for the PDF renderer's asynchronous calls (`pdf`).
windows-future = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    # The PDF viewer's rasterizer (`pdf`).
    "Data_Pdf",
    "Foundation",
    # Windows Hello's check before the passwords page reveals a password (`window::verify_user`).
    "Security_Credentials_UI",
    "Storage_Streams",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # Timer resolution for frame pacing (`timer_resolution`).
    "Win32_Media",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # Local time's offset by date (`window::local_offset_ms`).
    "Win32_System_Time",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    # The Downloads folder and the folder picker (`window::downloads_folder`, `pick_folder_dialog`).
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    # The Windows sign-in prompt where Windows Hello is not set up, checked as the current user's
    # logon (`window::verify_sign_in`), and whether the account has a password at all.
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_NetworkManagement_NetManagement",
    # The password store's key (`os_crypt`).
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
]

[[test]]
name = "it"
path = "tests/it.rs"
