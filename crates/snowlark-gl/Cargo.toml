[package]
name = "snowlark-gl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Snowlark's WebGL service: the command protocol a page's WebGL contexts send, and its executor on ANGLE (OpenGL ES over Direct3D 11)"
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

# The shared textures a test presents into, made as the browser makes them.
[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

# dlopen and dlsym for ANGLE's libraries on Linux (`ffi.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
