[package]
name = "snowlark-gl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Snowlark's WebGL service: the command protocol a page's WebGL contexts send, and its executor on ANGLE (OpenGL ES over Direct3D 11)"
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
]
