[package]
name = "snowlark-sw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Service Workers for Snowlark, the browser's half: the registrations, their job queues and versions, and the Cache API's storage, kept in memory or on disk"

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
url = "2.5"
snowlark-net = { path = "../snowlark-net" }
