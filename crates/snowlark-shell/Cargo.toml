[package]
name = "snowlark-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Snowlark browser window: tabs on their own threads, chrome drawn by us, DirectComposition compositing"

[dependencies]
snowlark-blocker = { path = "../snowlark-blocker" }
snowlark-dom = { path = "../snowlark-dom" }
snowlark-idb = { path = "../snowlark-idb" }
snowlark-sw = { path = "../snowlark-sw" }
snowlark-ipc = { path = "../snowlark-ipc" }
snowlark-js = { path = "../snowlark-js" }
snowlark-media = { path = "../snowlark-media" }
snowlark-net = { path = "../snowlark-net" }
snowlark-paint = { path = "../snowlark-paint" }
snowlark-tab = { path = "../snowlark-tab" }
snowlark-page = { path = "../snowlark-page" }
base64 = "0.22"
flate2 = "1"
# (the downloads search: text compared without its accents)
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# (the password store's AES-256-GCM)
ring = "0.17"
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
# (an update's SHA-256)
sha2 = "0.10"
# (the certificate viewer: X.509 certificates read, with the names of their OIDs)
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
const-oid = { version = "0.9", features = ["db"] }

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["use-std"] }
# (a local https server for the certificate chain's tests)
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
