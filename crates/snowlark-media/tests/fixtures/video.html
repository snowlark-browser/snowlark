<!doctype html>
<meta charset=utf-8>
<title>Snowlark media fixture</title>
<style>
  body { font: 14px system-ui; margin: 16px; }
  .box { position: relative; display: inline-block; }
  .badge { position: absolute; left: 12px; top: 12px; background: rgba(0,0,0,.6); color: #fff;
           padding: 2px 8px; border-radius: 4px; }
  video { width: 480px; height: 270px; background: #000; }
</style>
<h1>Media fixture</h1>
<div class=box>
  <video id=v controls poster=poster.png preload=metadata>
    <source src=pattern.mp4 type=video/mp4>
  </video>
  <div class=badge>over the video</div>
</div>
<p><video id=m src=pattern.mp4 muted autoplay loop width=240></video> muted autoplay loop</p>
<p><audio id=a src=pattern.mp4 controls></audio></p>
<pre id=log></pre>
<script>
  const log = document.getElementById('log');
  const v = document.getElementById('v');
  for (const t of ['loadedmetadata', 'canplay', 'play', 'playing', 'pause', 'seeked', 'ended'])
    v.addEventListener(t, () => log.textContent += t + ' ' + v.currentTime.toFixed(2) + '\n');
</script>
