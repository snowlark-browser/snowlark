[package]
name = "snowlark-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Snowlark media playback: media resources fetched through snowlark-net, Windows Media Foundation players decoding into the compositor's GPU textures, Media Source Extensions"

[dependencies]
aes = "0.8"
snowlark-audio = { path = "../snowlark-audio" }
snowlark-net = { path = "../snowlark-net" }
snowlark-paint = { path = "../snowlark-paint" }
serde = { version = "1", features = ["derive"] }

# Media Foundation, PlayReady and WASAPI (`win/`); Linux has no player yet (docs/linux.md, stage 7).
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_DirectX_Direct3D11",
    "Media_Core",
    "Media_Playback",
    "Media_Protection",
    "Media_MediaProperties",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.62"
features = [
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]
