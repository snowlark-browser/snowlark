<!doctype html>
<meta charset="utf-8">
<title>js/map-set</title>
<!-- Fill and query a Map and a Set with 500 string keys, then delete them (hash tables); no DOM. -->
<body>
<script src="../resources/runner.js"></script>
<script>
const keys = Array.from({ length: 500 }, (_, i) => 'key:' + i);
let sink = 0;
MicroBench.run({
  run() {
    const m = new Map();
    const s = new Set();
    for (let i = 0; i < keys.length; i++) { m.set(keys[i], i); s.add(keys[i]); }
    let n = 0;
    for (let i = 0; i < keys.length; i += 2) { n += m.get(keys[i]); if (s.has(keys[i + 1])) n++; }
    for (const [k, v] of m) if (v % 50 === 0) n += k.length;
    for (let i = 0; i < keys.length; i += 3) { m.delete(keys[i]); s.delete(keys[i]); }
    sink += n + m.size + s.size;
  },
  check() { return sink > 0; },
});
</script>
