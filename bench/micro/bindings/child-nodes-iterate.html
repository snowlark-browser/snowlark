<!doctype html>
<meta charset="utf-8">
<title>bindings/child-nodes-iterate</title>
<!-- Iterate a 200-child list through childNodes with for...of and through children by index. -->
<body>
<div id="host"></div>
<script src="../resources/runner.js"></script>
<script>
const ul = document.createElement('ul');
ul.innerHTML = MicroBench.repeat(200, (i) => '<li>' + i + '</li>');
document.getElementById('host').appendChild(ul);
let n = 0;
MicroBench.run({
  run() {
    for (const c of ul.childNodes) n += c.nodeType;
    const ch = ul.children;
    for (let i = 0; i < ch.length; i++) n += ch[i].nodeType;
  },
});
</script>
