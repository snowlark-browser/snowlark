<!doctype html>
<meta charset="utf-8">
<title>style/attribute-toggle</title>
<!-- Toggle an attribute that attribute selectors match on a container of 300 elements, then read a computed style. -->
<style>[data-state=open] .item .label { color: rgb(255, 0, 0); } [data-state=closed] .meta { color: rgb(0, 128, 0); }</style>
<body>
<div id="host"></div>
<script src="../resources/runner.js"></script>
<script>
const host = document.getElementById('host');
host.innerHTML = MicroBench.repeat(100, (i) => '<div class="item"><span class="label">Item ' + i + '</span><span class="meta">m</span></div>');
const last = host.lastElementChild.firstElementChild;
let open = false;
MicroBench.run({
  run() {
    open = !open;
    host.setAttribute('data-state', open ? 'open' : 'closed');
    getComputedStyle(last).color;
  },
});
</script>
