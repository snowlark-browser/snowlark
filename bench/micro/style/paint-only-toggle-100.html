<!doctype html>
<meta charset="utf-8">
<title>style/paint-only-toggle-100</title>
<!-- Toggle a class that changes only colours and backgrounds on 100 list items in flex rows, then read a layout value (the forced update: restyle, box tree, layout). -->
<style>
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; padding: 4px; border-bottom: 1px solid rgb(200, 200, 200); }
li label { flex: 1; color: rgb(60, 60, 60); }
.on li { background-color: rgb(250, 250, 220); border-bottom-color: rgb(150, 150, 150); }
.on li label { color: rgb(200, 0, 0); }
</style>
<body>
<ul id="host"></ul>
<script src="../resources/runner.js"></script>
<script>
const host = document.getElementById('host');
host.innerHTML = MicroBench.repeat(100, (i) => '<li><input type="checkbox"><label>Item ' + i + ' of the list</label><button>x</button></li>');
const last = host.lastElementChild;
let h = 0;
MicroBench.run({
  run() {
    host.classList.toggle('on');
    h = last.offsetTop;
  },
});
</script>
