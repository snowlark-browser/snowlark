<!doctype html>
<meta charset="utf-8">
<title>style/class-toggle-descendants</title>
<!-- Toggle a class on a container whose descendant rules restyle 300 elements, then read a computed style. -->
<style>.item span { color: rgb(0, 0, 255); } .on .item .label { color: rgb(255, 0, 0); } .on .item { padding-left: 2px; }</style>
<body>
<div id="host"></div>
<script src="../resources/runner.js"></script>
<script>
const host = document.getElementById('host');
host.innerHTML = MicroBench.repeat(100, (i) => '<div class="item"><span class="label">Item ' + i + '</span><span class="meta">m</span></div>');
const last = host.lastElementChild.firstElementChild;
let c = '';
MicroBench.run({
  run() {
    host.classList.toggle('on');
    c = getComputedStyle(last).color;
  },
});
</script>
