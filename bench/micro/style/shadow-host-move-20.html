<!doctype html>
<meta charset="utf-8">
<title>style/shadow-host-move-20</title>
<!-- Empty a container and append its 20 shadow hosts again (each with a style element and 12 elements in its shadow tree), then force layout: Perf-Dashboard's renderReplace. -->
<style>.pane { display: block; margin: 2px; } .pane-list { font: 12px sans-serif; }</style>
<body>
<div id="list" class="pane-list"></div>
<script src="../resources/runner.js"></script>
<script>
const css = ':host { display: block; position: relative; border: 1px solid #ccc; }\n'
  + 'header { display: flex; font-weight: bold; padding: 2px 4px; }\n'
  + 'h3 { margin: 0; font-size: 1em; flex: 1; }\n'
  + 'table { border-collapse: collapse; width: 100%; }\n'
  + 'td { padding: 1px 3px; text-align: right; }\n'
  + 'td a { color: #36c; text-decoration: none; }\n'
  + '.status { color: #666; } .status.warn { color: #c60; }\n'
  + 'canvas { display: block; width: 100%; height: 40px; }\n';
const list = document.getElementById('list');
const hosts = [];
for (let i = 0; i < 20; i++) {
  const host = document.createElement('div');
  host.className = 'pane';
  const root = host.attachShadow({ mode: 'open' });
  root.innerHTML = '<style>' + css + '</style>'
    + '<header><h3>Pane ' + i + '</h3><span class="status">ok</span></header>'
    + '<table><tr><td><a href="#">a</a></td><td>1</td></tr><tr><td><a href="#">b</a></td><td>2</td></tr></table>'
    + '<canvas></canvas>';
  hosts.push(host);
  list.appendChild(host);
}
let w = 0;
MicroBench.run({
  run() {
    list.textContent = '';
    for (const host of hosts) list.appendChild(host);
    w = list.offsetWidth + hosts[19].shadowRoot.querySelector('td').offsetWidth;
  },
  check() {
    return list.children.length === 20 && w > 0;
  },
});
</script>
