<!doctype html>
<meta charset="utf-8">
<title>layout/write-read-large-20</title>
<!-- On a page of ~2,700 elements, toggle one card's class (its height changes) and read another's
     getBoundingClientRect, 20 times: the cost of a forced update that changes little on a large page
     (NewsSite-Nuxt's 50 dirty getBoundingClientRect calls a navigation). -->
<style>
body { margin: 0; font: 14px sans-serif; }
#host { display: flex; flex-direction: column; width: 800px; }
.row { display: flex; gap: 8px; padding: 4px; }
.card { flex: 1; border: 1px solid #ccc; padding: 4px; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card p { margin: 0; }
.card.open p { padding-bottom: 12px; }
</style>
<body>
<div id="host"></div>
<script src="../resources/runner.js"></script>
<script>
const host = document.getElementById('host');
host.innerHTML = MicroBench.repeat(150, (r) => '<div class="row">' + MicroBench.repeat(3, (c) =>
  '<div class="card"><h3>Story ' + r + '.' + c + '</h3><p>A short summary of the story, <a href="#">with a link</a> and a few more words.</p></div>') + '</div>');
const cards = Array.from(host.querySelectorAll('.card'));
let y = 0;
MicroBench.run({
  run() {
    for (let i = 0; i < 20; i++) {
      cards[i * 20].classList.toggle('open');
      y += cards[449 - i * 7].getBoundingClientRect().top;
    }
  },
  check() { return y > 0; },
});
</script>
