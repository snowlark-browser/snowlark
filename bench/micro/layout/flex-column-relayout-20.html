<!doctype html>
<meta charset="utf-8">
<title>layout/flex-column-relayout-20</title>
<!-- Change the text of a link in one of 20 centered rows of nested flex rows in a flex column, then read its height (NewsSite's forced layouts). -->
<style>
  .page { display: flex; flex-direction: column; width: 900px; }
  .card { display: flex; align-items: center; gap: 8px; padding: 4px; }
  .links { display: flex; align-items: center; gap: 6px; }
  .link { display: flex; align-items: center; padding: 2px 4px; }
  .badge { width: 40px; height: 48px; }
</style>
<body>
<div id="host"></div>
<script src="../resources/runner.js"></script>
<script>
const host = document.getElementById('host');
const link = (i, j) => '<div class="link"><span>Section ' + i + '-' + j + '</span></div>';
host.innerHTML = '<div class="page">' + MicroBench.repeat(20, (i) =>
  '<div class="card"><div class="links">' + MicroBench.repeat(4, (j) => link(i, j)) +
  '</div><div class="badge"></div></div>') + '</div>';
const target = host.querySelectorAll('.card')[10].querySelector('span');
const card = target.closest('.card');
let long = false;
MicroBench.run({
  run() {
    long = !long;
    target.textContent = long ? 'Section ten, longer' : 'Section 10';
    MicroBench.flush(card);
  },
  check() {
    return card.offsetHeight > 0;
  },
});
</script>
